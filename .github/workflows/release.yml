name: Publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish, for example v1.0.0
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Validate source and package archive
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r php_file; do
            php -l "$php_file" >/dev/null
          done < <(find Upload tests -type f -name '*.php' | sort)

          while IFS= read -r js_file; do
            node --check "$js_file" >/dev/null
          done < <(find Upload -type f -name '*.js' | sort)

          php tests/spam_preventer_test.php

          version="$(sed -n "s/.*'version'[[:space:]]*=>[[:space:]]*'\([^']*\)'.*/\1/p" Upload/inc/plugins/spam_preventer.php | head -n 1)"
          if [ -z "$version" ]; then
            echo "Plugin version is missing." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Plugin version is invalid: $version." >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG#v}" != "$version" ]]; then
            echo "Tag $RELEASE_TAG does not match plugin version $version." >&2
            exit 1
          fi
          if ! grep -E "^## \\[?$version\\]?([ -]|$)" CHANGELOG.md >/dev/null; then
            echo "CHANGELOG.md has no release heading for $version." >&2
            exit 1
          fi

          release_body="$(awk -v version="$version" '
            $0 ~ "^## \\[?" version "\\]?([ -]|$)" { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md | sed '/./,$!d')"
          if [ -z "$release_body" ]; then
            release_body="Automated release for $RELEASE_TAG."
          fi

          mkdir -p dist
          archive="dist/mybb-spam-preventer-$version.zip"
          zip -X -q -r "$archive" Upload README.md LICENSE CHANGELOG.md default-blocked-phrases.txt

          archive_contents="$(unzip -Z1 "$archive")"
          required_entries=(
            Upload/inc/plugins/spam_preventer.php
            Upload/inc/languages/english/spam_preventer.lang.php
            Upload/jscripts/spam-preventer/quick-reply-errors.js
            README.md
            LICENSE
            CHANGELOG.md
            default-blocked-phrases.txt
          )
          for required_entry in "${required_entries[@]}"; do
            grep -F -x "$required_entry" <<< "$archive_contents" >/dev/null || {
              echo "Archive is missing required entry: $required_entry" >&2
              exit 1
            }
          done

          printf '%s\n' "$release_body" > release-notes.md

      - name: Create GitHub release or replace its archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Spam Preventer $RELEASE_TAG" --notes-file release-notes.md --latest
            gh release upload "$RELEASE_TAG" dist/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip --verify-tag --title "Spam Preventer $RELEASE_TAG" --notes-file release-notes.md --latest
          fi
